[package]
name = "gofin-solana"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.22.1"
bincode = "1.3.3"
bs58 = "0.5.1"
chrono.workspace = true
ed25519-dalek.workspace = true
gofin-domain.workspace = true
gofin-token-cache = { path = "../gofin-token-cache" }
gofin-pricing = { path = "../gofin-pricing" }
futures-util = "0.3.31"
hex.workspace = true
httpdate = "=1.0.3"
reqwest = { workspace = true, features = ["stream"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
solana-address = { version = "=2.8.0", features = ["std", "decode", "sha2"] }
solana-address-lookup-table-interface = { version = "=4.0.0", features = ["bincode", "bytemuck"] }
solana-hash = "=4.7.0"
solana-instruction = "=4.0.0"
solana-instruction3 = { package = "solana-instruction", version = "=3.3.0" }
solana-pubkey3 = { package = "solana-pubkey", version = "=3.0.0", features = ["curve25519"] }
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
solana-message = { version = "=5.1.0", features = ["serde"] }
solana-program-option = "=3.1.0"
solana-program-pack = "=3.1.0"
solana-signature = { version = "=3.6.0", features = ["serde", "verify"] }
solana-transaction = { version = "=5.1.0", features = ["serde", "verify"] }
spl-associated-token-account-interface = "=2.0.0"
spl-tlv-account-resolution = "=0.11.4"
spl-type-length-value = "=0.9.1"
spl-token-2022-interface = "=3.1.2"
spl-transfer-hook-interface = "=2.1.0"
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
gofin-store = { path = "../gofin-store" }

[lints]
workspace = true
