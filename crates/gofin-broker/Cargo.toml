gofin-coinbase.workspace = true
gofin-bridge.workspace = true
gofin-exchange = { workspace = true, features = ["binance", "kraken", "hyperliquid", "okx", "coinbase", "bybit"] }
gofin-credentials.workspace = true
gofin-discovery.workspace = true
gofin-human-terminal.workspace = true
gofin-networks.workspace = true
gofin-hyperliquid.workspace = true
gofin-presentation.workspace = true
gofin-pricing.workspace = true
gofin-domain.workspace = true
gofin-engine.workspace = true
gofin-ethereum.workspace = true
gofin-jupiter.workspace = true
gofin-evm.workspace = true
gofin-protocol.workspace = true
gofin-store.workspace = true
gofin-solana.workspace = true
bs58 = "0.5.1"
bincode = "1.3.3"
hex.workspace = true
libc.workspace = true
num-bigint.workspace = true
reqwest.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
solana-message = { version = "=5.1.0", features = ["serde"] }
