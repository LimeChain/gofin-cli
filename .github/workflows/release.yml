name: Release bundles

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: gofin-release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Resolve and validate source
        id: source
        env:
          GOFIN_REQUESTED_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          args = ['python3', 'scripts/build-release.py', '--resolve', '--tag', os.environ['GOFIN_REQUESTED_TAG']]
          source = json.loads(subprocess.check_output(args, text=True))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('tag', 'commit'):
                  value = source[key]
                  output.write(key + '=' + (str(value).lower() if isinstance(value, bool) else value) + '\n')
          PY

  validate:
    needs: resolve
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - name: Cache Rust validation artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-validation-aarch64-apple-darwin
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: make test-security
      - name: Synthetic delivery tests
        run: make test-delivery
      - name: macOS installer and native presentation tests
        run: |
          python3 scripts/test-rust-macos-installer.py
          python3 scripts/test-rust-macos-runtime-update.py
          python3 scripts/test-rust-macos-uninstall.py
          python3 scripts/test-dev-workflow.py
          make test-native-approval

  e2e:
    needs: resolve
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      GOFIN_TAG: ${{ needs.resolve.outputs.tag }}
      GOFIN_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.target }}
      - name: Cache Rust release artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-artifact-${{ matrix.target }}
          cache-on-failure: true
      - name: Build inspectable release archives
        env:
          GOFIN_PUBLISHED_RELEASE: '1'
        run: |
          python3 - <<'PY'
          import os, subprocess
          args = ['python3', 'scripts/build-release.py', '--tag', os.environ['GOFIN_TAG'],
                  '--target', os.environ['GOFIN_TARGET'], '--output-dir', os.environ['RUNNER_TEMP'] + '/gofin-assets']
          subprocess.run(args, check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gofin-${{ needs.resolve.outputs.tag }}-${{ matrix.target }}
          path: ${{ runner.temp }}/gofin-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [resolve, validate, e2e, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GOFIN_TAG: ${{ needs.resolve.outputs.tag }}
      GOFIN_RELEASE_ID: ${{ github.event.release.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: gofin-${{ needs.resolve.outputs.tag }}-*
          path: ${{ runner.temp }}/gofin-assets
          merge-multiple: true
      - name: Validate and attach assets to the published release
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          tag = os.environ['GOFIN_TAG']
          assets = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gofin-assets'
          subprocess.run(['python3', 'scripts/build-release.py', '--tag', tag, '--assemble',
                          '--output-dir', str(assets), '--installer', 'scripts/install.sh'], check=True)
          subprocess.run(['python3', 'scripts/upload-release.py', '--repo', os.environ['GH_REPO'],
                          '--tag', tag, '--release-id', os.environ['GOFIN_RELEASE_ID'],
                          '--assets-dir', str(assets)], check=True)
          PY
