name: Automated financial regressions
on: [push, workflow_dispatch]
concurrency:
  group: gofin-regressions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Formatting and Clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
          components: rustfmt, clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: financial-regressions
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  tests:
    name: Critical security negatives
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.1'
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: financial-regressions
          cache-on-failure: true
      - name: Run explicitly retained security-negative tests
        run: make test-security
      - name: Verify Rust-to-native approval contracts
        run: make test-native-approval
      - name: Preserve security test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-security-negatives
          path: .context/test-runs/security-*/
          if-no-files-found: error

  lifecycle:
    name: Lifecycle and delivery
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthetic release delivery tests
        run: make test-delivery
      - name: Synthetic installer, update, uninstall and development lifecycle
        run: |
          python3 scripts/test-rust-macos-installer.py
          python3 scripts/test-rust-macos-runtime-update.py
          python3 scripts/test-rust-macos-uninstall.py
          python3 scripts/test-dev-workflow.py

  native:
    name: Native Swift checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh native/build.sh

  e2e:
    uses: ./.github/workflows/e2e.yml

  rust:
    # Keep the existing required-check name; skipped/failed jobs cannot pass it.
    name: rust (macos-latest)
    needs: [lint, tests, lifecycle, native, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every regression job
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert len(results) == 5 and all(result == 'success' for result in results), results
          PY
