[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0-beta.1"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/LimeChain/gofin-cli"

[workspace.dependencies]
bs58 = "0.5.1"
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision"] }
schemars = "1.2.2"
jsonschema = { version = "0.58.6", default-features = false, features = ["arbitrary-precision"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal", "sync", "process", "fs"] }
sha2 = "0.10.9"
hex = "0.4.3"
num-bigint = "0.4.6"
num-traits = "0.2.19"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
tempfile = "3.23.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5.51", features = ["derive"] }
zeroize = { version = "1.8.2", features = ["derive"] }
libc = "0.2.177"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "pem", "zeroize"] }
gofin-domain = { path = "crates/gofin-domain" }
gofin-store = { path = "crates/gofin-store" }
gofin-engine = { path = "crates/gofin-engine" }
gofin-binance = { path = "crates/gofin-binance" }
gofin-hyperliquid = { path = "crates/gofin-hyperliquid" }
gofin-kraken = { path = "crates/gofin-kraken" }
gofin-coinbase = { path = "crates/gofin-coinbase" }
gofin-exchange = { path = "crates/gofin-exchange", default-features = false }
gofin-authorization = { path = "crates/gofin-authorization" }
gofin-credentials = { path = "crates/gofin-credentials" }
gofin-discovery = { path = "crates/gofin-discovery" }
gofin-protocol = { path = "crates/gofin-protocol" }
gofin-evm = { path = "crates/gofin-evm" }
gofin-solana = { path = "crates/gofin-solana" }
gofin-jupiter = { path = "crates/gofin-jupiter" }
gofin-meteora = { path = "crates/gofin-meteora" }
gofin-bridge = { path = "crates/gofin-bridge" }
gofin-ethereum = { path = "crates/gofin-ethereum" }
gofin-broker = { path = "crates/gofin-broker" }
gofin-human-terminal = { path = "crates/gofin-human-terminal" }
gofin-presentation = { path = "crates/gofin-presentation" }
gofin-pricing = { path = "crates/gofin-pricing" }
gofin-amm = { path = "crates/gofin-amm" }
gofin-networks = { path = "crates/gofin-networks" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Generated exchange/protocol SDK debug symbols dwarf the local GoFin code.
# Keep incremental debug builds practical without changing runtime optimizations.
[profile.dev]
debug = 0

[profile.test]
debug = 0

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
