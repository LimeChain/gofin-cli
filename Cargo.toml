[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0-beta.1"
edition = "2024"
rust-version = "1.97"
repository = "https://github.com/LimeChain/fin-cli"

[workspace.dependencies]
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision"] }
schemars = "1.2.2"
jsonschema = { version = "0.58.6", default-features = false, features = ["arbitrary-precision"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal", "sync", "process", "fs"] }
sha2 = "0.10.9"
hex = "0.4.3"
num-bigint = "0.4.6"
num-traits = "0.2.19"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
tempfile = "3.23.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5.51", features = ["derive"] }
zeroize = { version = "1.8.2", features = ["derive"] }
libc = "0.2.177"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "pem", "zeroize"] }
fin-domain = { path = "crates/fin-domain" }
fin-store = { path = "crates/fin-store" }
fin-engine = { path = "crates/fin-engine" }
fin-binance = { path = "crates/fin-binance" }
fin-exchange = { path = "crates/fin-exchange", default-features = false }
fin-authorization = { path = "crates/fin-authorization" }
fin-credentials = { path = "crates/fin-credentials" }
fin-discovery = { path = "crates/fin-discovery" }
fin-protocol = { path = "crates/fin-protocol" }
fin-evm = { path = "crates/fin-evm" }
fin-bridge = { path = "crates/fin-bridge" }
fin-ethereum = { path = "crates/fin-ethereum" }
fin-broker = { path = "crates/fin-broker" }
fin-human-terminal = { path = "crates/fin-human-terminal" }
fin-presentation = { path = "crates/fin-presentation" }
fin-pricing = { path = "crates/fin-pricing" }
fin-amm = { path = "crates/fin-amm" }
fin-networks = { path = "crates/fin-networks" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Generated exchange/protocol SDK debug symbols dwarf the local Fin code.
# Keep incremental debug builds practical without changing runtime optimizations.
[profile.dev]
debug = 0

[profile.test]
debug = 0

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
